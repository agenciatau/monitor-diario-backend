name: Daily Analyses

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 09:00 UTC, weekdays
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run analyses
        env:
          MONITOR_SUPABASE_URL: ${{ secrets.MONITOR_SUPABASE_URL }}
          MONITOR_SUPABASE_KEY: ${{ secrets.MONITOR_SUPABASE_KEY }}
        run: deno run --allow-net --allow-read --allow-env trigger_analyses.ts
