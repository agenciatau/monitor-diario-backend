name: Daily Scraper

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 09:00 UTC = 06:00 BRT, weekdays
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}
          VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
        run: deno run --allow-net --allow-read --allow-write --allow-env --unsafely-ignore-certificate-errors=dool.egba.ba.gov.br pdfs_scraper.ts
